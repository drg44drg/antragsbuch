<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' blob:; style-src 'unsafe-inline'; img-src data: blob:; worker-src blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Antragsbuch 2026</title>
<style>:root {
  color-scheme: light;
  --bg: #f1f2f7; --surface: #ffffff; --surface-2: #f6f6fb; --line: #e3e4ee; --line-2: #d2d3e0;
  --text: #15141c; --text-2: #55546a; --text-3: #85849a;
  --accent: #6250d6; --accent-2: #7a69ea; --accent-ink: #ffffff; --accent-soft: #ece9fc;
  --s1: #6250d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #2a78d6; --s0: #b9b8c8;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --good-ink: #006300; --crit-ink: #b02a2a; --warn-ink: #7a5200;
  --shadow: 0 1px 2px rgba(20, 18, 40, .05), 0 8px 24px rgba(20, 18, 40, .06);
  --glow: none;
  --r: 18px; --r-s: 11px;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b0a12; --surface: #15141f; --surface-2: #1b1a28; --line: #272636; --line-2: #37364a;
    --text: #f2f1f7; --text-2: #b8b6ca; --text-3: #8785a0;
    --accent: #9085e9; --accent-2: #a79df2; --accent-ink: #120f22; --accent-soft: #252148;
    --s1: #9085e9; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #3987e5; --s0: #4a4960;
    --good-ink: #3fc63f; --crit-ink: #f08a8a; --warn-ink: #fab219;
    --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 10px 30px rgba(0, 0, 0, .35);
    --glow: 0 0 0 1px rgba(144, 133, 233, .25), 0 8px 30px rgba(98, 80, 214, .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0a12; --surface: #15141f; --surface-2: #1b1a28; --line: #272636; --line-2: #37364a;
  --text: #f2f1f7; --text-2: #b8b6ca; --text-3: #8785a0;
  --accent: #9085e9; --accent-2: #a79df2; --accent-ink: #120f22; --accent-soft: #252148;
  --s1: #9085e9; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #3987e5; --s0: #4a4960;
  --good-ink: #3fc63f; --crit-ink: #f08a8a; --warn-ink: #fab219;
  --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 10px 30px rgba(0, 0, 0, .35);
  --glow: 0 0 0 1px rgba(144, 133, 233, .25), 0 8px 30px rgba(98, 80, 214, .25);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
h1 { font-size: 26px; } h2 { font-size: 18px; } h3 { font-size: 15px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); } .klein { font-size: 13px; } .mini { font-size: 12px; color: var(--text-3); }
.rechts { text-align: right; justify-content: flex-end; }
[hidden] { display: none !important; }

/* ---------- Grundgerüst ---------- */
#app { display: grid; grid-template-columns: 218px 1fr; height: 100vh; }
.seite { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 12px 12px; gap: 4px; min-height: 0; }
.marke { display: flex; align-items: center; gap: 10px; padding: 2px 8px 16px; }
.marke .logo { width: 34px; height: 34px; border-radius: 11px; background: linear-gradient(135deg, var(--accent), var(--s5)); display: grid; place-items: center; color: #fff; font-weight: 700; box-shadow: var(--glow); }
.marke b { font-size: 16px; letter-spacing: -.01em; } .marke span { display: block; font-size: 12px; color: var(--text-3); }
.nav { display: flex; flex-direction: column; gap: 2px; flex: 1; min-height: 0; overflow: auto; }
.nav button { all: unset; display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 12px; cursor: pointer; color: var(--text-2); font-weight: 500; transition: background .18s, color .18s, transform .18s; }
.nav button:hover { background: var(--surface-2); color: var(--text); }
.nav button:focus-visible, .btn:focus-visible, .seg button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.nav button.aktiv { background: var(--accent-soft); color: var(--text); }
.nav button.aktiv svg { color: var(--accent); }
.nav svg { width: 19px; height: 19px; flex: none; }
.nav .zahl { margin-left: auto; background: var(--accent); color: var(--accent-ink); font-size: 11.5px; font-weight: 700; border-radius: 99px; padding: 1px 7px; }
.seite .fuss { border-top: 1px solid var(--line); padding: 12px 8px 2px; font-size: 12.5px; color: var(--text-2); display: flex; flex-direction: column; gap: 8px; }
.speicher { display: flex; align-items: center; gap: 8px; }
.punkt { width: 9px; height: 9px; border-radius: 50%; background: var(--good); flex: none; }
.punkt.warn { background: var(--warn); } .punkt.krit { background: var(--crit); } .punkt.lauf { background: var(--accent); animation: puls 1s infinite; }
@keyframes puls { 50% { opacity: .35; } }

.haupt { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.kopf { display: flex; align-items: center; gap: 12px; padding: 14px 26px 10px; }
.kopf .titel { flex: 1; min-width: 0; }
.kopf .titel h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kopf .titel .mini { margin-top: 1px; }
.inhalt { flex: 1; min-height: 0; overflow: auto; padding: 8px 26px 26px; display: flex; flex-direction: column; gap: 16px; }
.inhalt.fest { overflow: hidden; }

/* ---------- Bausteine ---------- */
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 12px; padding: 8px 14px; cursor: pointer; font-weight: 550; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; transition: transform .12s, background .18s, border-color .18s, box-shadow .18s; }
.btn:hover { border-color: var(--accent); } .btn:active { transform: scale(.97); }
.btn.haupt-btn { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: var(--glow); }
.btn.haupt-btn:hover { background: var(--accent-2); }
.btn.leise { border-color: transparent; background: transparent; color: var(--text-2); } .btn.leise:hover { background: var(--surface-2); color: var(--text); }
.btn.gefahr { color: var(--crit-ink); } .btn.klein-btn { padding: 5px 10px; font-size: 13px; border-radius: 10px; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn svg { width: 16px; height: 16px; }
kbd { font: 11px var(--font); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--text-3); background: var(--surface-2); }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { all: unset; padding: 5px 12px; border-radius: 9px; cursor: pointer; font-size: 13.5px; font-weight: 550; color: var(--text-2); transition: background .2s, color .2s; }
.seg button.aktiv { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.karte { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px 20px; min-width: 0; }
.karte > h3 { margin-bottom: 4px; } .karte .unter { color: var(--text-3); font-size: 12.5px; margin-bottom: 10px; }
.raster { display: grid; gap: 16px; }
.r-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } .r-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.r-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .r-21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); } .r-12 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
.r-6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (max-width: 1500px) { .r-6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.leiste { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.leiste .frei { flex: 1; }
.feld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.feld > span { font-size: 12.5px; color: var(--text-2); font-weight: 550; }
.feld > span i { color: var(--crit-ink); font-style: normal; }
input[type=text], input[type=date], input[type=number], input[type=search], select, textarea {
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px; min-width: 0; width: 100%; transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input.fehler, select.fehler { border-color: var(--crit); box-shadow: 0 0 0 3px color-mix(in srgb, var(--crit) 18%, transparent); }
input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); margin: 0; }
.suche { position: relative; flex: 1; max-width: 420px; min-width: 200px; }
.suche input { padding-left: 36px; border-radius: 12px; } .suche svg { position: absolute; left: 11px; top: 50%; translate: 0 -50%; width: 17px; height: 17px; color: var(--text-3); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); border-radius: 99px; padding: 3px 11px; font-size: 13px; background: var(--surface); cursor: pointer; user-select: none; transition: background .18s, border-color .18s; }
.chip.aktiv { background: var(--accent-soft); border-color: var(--accent); }
.chip input { display: none; }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; white-space: nowrap; }
.status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--s0); flex: none; }
.status.eingereicht::before { background: var(--s6); } .status.policiert::before { background: var(--s4); }
.status.abgerechnet::before { background: var(--good); } .status.storno::before { background: var(--crit); }
.status.reklamiert::before { background: var(--serious); border-radius: 2px; }
.status.abgelehnt::before, .status.widerruf::before, .status.absage::before { background: transparent; border: 2px solid var(--text-3); }
.marke-s { font-size: 11.5px; font-weight: 700; border-radius: 6px; padding: 1px 6px; background: var(--accent-soft); color: var(--text); white-space: nowrap; }
.marke-s.krit { background: color-mix(in srgb, var(--crit) 16%, transparent); color: var(--crit-ink); }
.marke-s.warn { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn-ink); }
.marke-s.gut { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good-ink); }
.plus { color: var(--good-ink); } .minus { color: var(--crit-ink); }

/* ---------- Kennzahl-Kacheln ---------- */
.kachel { position: relative; overflow: hidden; padding: 16px 18px; }
.kachel .lbl { font-size: 12.5px; color: var(--text-2); font-weight: 550; display: flex; align-items: center; gap: 7px; }
.kachel .wert { font-size: 30px; font-weight: 650; letter-spacing: -.025em; line-height: 1.15; margin-top: 6px; white-space: nowrap; }
.kachel .wert small { font-size: 15px; font-weight: 500; color: var(--text-3); margin-left: 3px; letter-spacing: 0; }
.kachel .neben { font-size: 12.5px; color: var(--text-2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kachel.akzent { background: linear-gradient(140deg, var(--accent), #8a4fd6 120%); border-color: transparent; color: #fff; box-shadow: var(--glow), var(--shadow); }
.kachel.akzent .lbl, .kachel.akzent .neben, .kachel.akzent .wert small { color: rgba(255, 255, 255, .82); }
.kachel .funke { position: absolute; right: 12px; bottom: 10px; width: 92px; height: 34px; opacity: .9; }
.hinweise { display: flex; flex-wrap: wrap; gap: 8px; }
.hinweis { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 7px 13px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 13.5px; font-weight: 550; transition: transform .15s, border-color .15s; }
.hinweis:hover { transform: translateY(-1px); border-color: var(--accent); }
.hinweis::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--s6); }
.hinweis.warn::before { background: var(--warn); } .hinweis.krit::before { background: var(--crit); }

/* ---------- Tabelle (virtuell) ---------- */
.vt { display: flex; flex-direction: column; min-height: 0; flex: 1; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.vt-kopf, .vt-zeile, .vt-fuss { display: grid; align-items: center; column-gap: 12px; padding: 0 16px; }
.vt-kopf { border-bottom: 1px solid var(--line); font-size: 12.5px; font-weight: 600; color: var(--text-2); height: 40px; flex: none; background: var(--surface-2); scrollbar-gutter: stable; overflow: hidden; }
.vt-kopf > div { cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; user-select: none; }
.vt-kopf > div.fix { cursor: default; }
.vt-kopf > div[aria-sort=ascending]::after { content: "▲"; font-size: 8px; color: var(--accent); }
.vt-kopf > div[aria-sort=descending]::after { content: "▼"; font-size: 8px; color: var(--accent); }
.vt-rumpf { flex: 1; overflow-y: auto; min-height: 0; position: relative; scrollbar-gutter: stable; }
.vt-zeile { position: absolute; left: 0; right: 0; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .12s; }
.vt-zeile:hover { background: var(--surface-2); }
.vt-zeile.blass { opacity: .55; }
.vt-zeile > div, .vt-fuss > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; min-width: 0; }
.vt-zeile .zwei { flex-direction: column; align-items: flex-start; gap: 0; line-height: 1.25; }
.vt-zeile .zwei small { color: var(--text-3); font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.vt-fuss { border-top: 1px solid var(--line); height: 40px; font-weight: 600; font-size: 13.5px; flex: none; background: var(--surface-2); scrollbar-gutter: stable; }
.vt-leer { padding: 44px 20px; text-align: center; color: var(--text-2); }
.reiter { display: flex; gap: 6px; flex-wrap: wrap; }
.reiter button { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 12px; font-weight: 600; font-size: 14px; color: var(--text-2); border: 1px solid transparent; display: flex; align-items: center; gap: 8px; transition: background .2s, color .2s; }
.reiter button:hover { background: var(--surface); }
.reiter button.aktiv { background: var(--surface); border-color: var(--line); color: var(--text); box-shadow: var(--shadow); }
.reiter .zahl { font-size: 12px; background: var(--surface-2); border-radius: 99px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
.reiter button.aktiv .zahl { background: var(--accent); color: var(--accent-ink); }

/* ---------- Ablagezone ---------- */
.ablage { border: 2px dashed var(--line-2); border-radius: var(--r); padding: 18px 20px; display: flex; align-items: center; gap: 16px; background: var(--surface); transition: border-color .2s, background .2s, transform .2s; }
.ablage.gross { flex-direction: column; text-align: center; padding: 46px 20px; }
.ablage svg { width: 34px; height: 34px; color: var(--accent); flex: none; }
body.zieht .ablage, .ablage.drueber { border-color: var(--accent); background: var(--accent-soft); }
#ziehschirm { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--accent) 22%, transparent); backdrop-filter: blur(3px); display: none; place-items: center; pointer-events: none; }
body.zieht #ziehschirm { display: grid; }
#ziehschirm div { background: var(--surface); border: 2px dashed var(--accent); border-radius: 22px; padding: 30px 46px; font-size: 20px; font-weight: 600; box-shadow: var(--shadow); }

/* ---------- Dialog ---------- */
dialog { border: 1px solid var(--line); border-radius: 22px; background: var(--surface); color: var(--text); padding: 0; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); max-width: min(1040px, 96vw); width: 100%; max-height: 94vh; }
dialog.schmal { max-width: 560px; } dialog.mittel { max-width: 780px; }
dialog::backdrop { background: rgba(10, 8, 25, .5); backdrop-filter: blur(3px); }
dialog[open] { animation: auf .22s cubic-bezier(.2, .9, .3, 1.15); display: flex; flex-direction: column; }
@keyframes auf { from { opacity: 0; transform: translateY(14px) scale(.98); } }
.dlg-kopf { padding: 18px 24px 8px; display: flex; align-items: center; gap: 12px; }
.dlg-kopf h2 { flex: 1; }
.dlg-rumpf { padding: 6px 24px 14px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.dlg-fuss { padding: 12px 24px 18px; display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--line); flex-wrap: wrap; }
.formraster { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px 14px; }
.s2 { grid-column: span 2; } .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
.pos-kopf, .pos-zeile { display: grid; grid-template-columns: 1.3fr .6fr 1fr .7fr .9fr 34px; gap: 8px; align-items: center; }
.pos-kopf { font-size: 12px; color: var(--text-2); font-weight: 600; padding: 0 2px; }
.pos-zeile { margin-top: 6px; }
.meldung { border-radius: 12px; padding: 10px 14px; font-size: 13.5px; background: var(--surface-2); border: 1px solid var(--line); }
.meldung.krit { background: color-mix(in srgb, var(--crit) 10%, var(--surface)); border-color: color-mix(in srgb, var(--crit) 40%, transparent); }
.meldung.warn { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border-color: color-mix(in srgb, var(--warn) 55%, transparent); }
.meldung ul { margin: 4px 0 0; padding-left: 18px; }
.schalter { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.historie { font-size: 13px; color: var(--text-2); display: flex; flex-direction: column; gap: 3px; }

/* ---------- Diagramme ---------- */
.dia { position: relative; width: 100%; }
.dia svg { display: block; width: 100%; height: auto; overflow: visible; }
.dia text { fill: var(--text-3); font: 11.5px var(--font); font-variant-numeric: tabular-nums; }
.dia .gitter { stroke: var(--line); stroke-width: 1; } .dia .null { stroke: var(--line-2); }
.dia .balken { transform-box: fill-box; transform-origin: 50% 100%; animation: wachs .7s cubic-bezier(.2, .8, .2, 1) both; transition: opacity .15s; }
.dia .balken.neg { transform-origin: 50% 0%; }
.dia .hb { transform-box: fill-box; transform-origin: 0 50%; animation: wachsx .7s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes wachs { from { transform: scaleY(0); } } @keyframes wachsx { from { transform: scaleX(0); } }
.dia .linie { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: zieh 1.1s ease-out forwards; }
.dia .linie.strich { stroke-dasharray: .012 .012; stroke-dashoffset: 0; animation: blend .8s both; }
.dia .flaeche { animation: blend 1.2s both; } .dia .knoten { animation: blend .5s .7s both; stroke: var(--surface); stroke-width: 2; }
@keyframes zieh { to { stroke-dashoffset: 0; } } @keyframes blend { from { opacity: 0; } }
.dia .ring { fill: none; stroke-linecap: butt; transition: stroke-width .15s, opacity .15s; animation: zieh 1s cubic-bezier(.3, .7, .2, 1) both; }
.dia .spalte:hover .balken, .dia .ring:hover { opacity: .82; }
.dia .fadenkreuz { stroke: var(--line-2); stroke-dasharray: 3 3; }
.legende { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--text-2); margin-top: 8px; }
.legende span { display: inline-flex; align-items: center; gap: 6px; }
.legende i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legende.spalte { flex-direction: column; gap: 7px; } .legende.spalte span { justify-content: flex-start; white-space: nowrap; } .legende b { white-space: nowrap; margin-left: auto; color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; padding-left: 14px; }
.ringbox { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; justify-content: center; }
.ringbox > .dia { width: 160px; flex: none; } .ringbox > .legende { flex: 1 1 150px; min-width: 150px; }
.ringmitte { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
.ringmitte b { display: block; font-size: 17px; letter-spacing: -.02em; white-space: nowrap; } .ringmitte span { font-size: 12px; color: var(--text-3); }
#tipp { position: fixed; z-index: 100; pointer-events: none; background: var(--text); color: var(--bg); border-radius: 10px; padding: 7px 11px; font-size: 12.5px; line-height: 1.4; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); opacity: 0; transition: opacity .12s; max-width: 280px; }
