nreichung. Die Bearbeitungsampel beginnt ab diesem Tag zu zählen.",datei:"Keine Datei nötig."},{nr:2,titel:"Policierung abwarten",kurz:"Veränderungsdienst einlesen",icon:"vdienst",ziel:"vdienst",knopf:"Zum Veränderungsdienst",was:'Der Versicherer bearbeitet den Antrag. Lesen Sie den Veränderungsdienst ein: Passende Anträge werden „Policiert" und erhalten ihre Vertragsnummer. Ohne Veränderungsdienst setzen Sie den Status von Hand.',wann:"Sobald der Veränderungsdienst vorliegt. Wird die Ampel vorher gelb oder rot, lohnt eine Nachfrage.",datei:"Veränderungsdienst als CSV oder Excel. Der genaue Dateiname wird noch ergänzt."},{nr:3,titel:"Abrechnung einlesen",kurz:"ab dem 6. des Folgemonats",icon:"hoch",ziel:"abgleich",knopf:"Zum Abgleich",was:"Die Provisionsabrechnung ins Fenster ziehen. Die Datei ist kumuliert seit Januar – Sie lesen jeden Monat einfach die neueste ein. Die App erkennt, welche Buchungen neu sind.",wann:"Monatlich, etwa ab dem 6. Die App erinnert Sie in der Übersicht daran.",datei:"Provisionsabrechnung als CSV, unverändert aus dem Portal. Der genaue Dateiname wird noch ergänzt."},{nr:4,titel:"Abgleich prüfen",kurz:"fünf Listen durchgehen",icon:"abgleich",ziel:"abgleich",knopf:"Zum Abgleich",was:'Die App ordnet Buchungen Ihren Anträgen zu. „Gleich" ist erledigt. Prüfen Sie „Abweichung" (Betrag passt nicht), „Offen" (keine Buchung), „Neu ohne Antrag" (Buchung ohne Eintrag) und „Storno".',wann:"Direkt nach dem Einlesen. Zuordnungsvorschläge bestätigen Sie mit einem Klick.",datei:"Keine weitere Datei."},{nr:5,titel:"Klären und nachhalten",kurz:"exportieren, reklamieren",icon:"runter",ziel:"antraege",knopf:"Zu den Anträgen",was:"Was hängt oder nicht stimmt, geben Sie gezielt weiter: Anträge anhaken und die Prioritätenliste exportieren, oder eine Abweichung reklamieren. Korrekturen in späteren Abrechnungen ordnet die App von selbst zu.",wann:"Bei roten Ampeln, offenen Nachbearbeitungen und Abweichungen. Danach beginnt der Kreis mit dem nächsten Antrag von vorn.",datei:"Export als Excel oder PDF."}],l=[["Wo sind meine Daten gespeichert?","In Ihrer Projektdatei – den Speicherort haben Sie beim Anlegen selbst gewählt – und als Sicherung im Browser dieses Rechners. Nichts wird ins Internet übertragen; das ist im Programm gesperrt."],["Muss ich speichern?",'Nein. Jede Änderung wird automatisch gespeichert. Unten links steht „Gespeichert um …". Kann der Browser nicht direkt in Dateien schreiben, erscheint dort ein Hinweis; dann bitte regelmäßig „Kopie herunterladen".'],["Die Abrechnung enthält doch wieder alle Monate – lese ich etwas doppelt ein?","Nein. Die Datei ist kumuliert, und jeder Import ersetzt den Stand des Jahres. Die App vergleicht mit dem letzten Import und markiert nur die neuen Buchungen. Bestätigte Zuordnungen und abgehakte Buchungen bleiben erhalten."],["Ich habe die Vertragsnummer noch nicht. Was nun?","Bei Neugeschäft tragen Sie sie nach der Policierung nach – oder gar nicht von Hand: Der Veränderungsdienst ergänzt sie, und im Abgleich schlägt die App passende Buchungen vor (über Name, Beitrag, Beginn und Tarif)."],["Was bedeutet die Ampel?","Sie zählt Werktage seit der Einreichung, ohne Wochenenden und Feiertage. Grün: im Rahmen. Gelb: Frist erreicht. Rot: überfällig oder Nachbearbeitung offen. Die Fristen je Bereich stehen in den Einstellungen."],['Warum ist ein policierter Antrag noch nicht „Abgerechnet"?',"Die Provision wird erst mit der Abrechnung des Folgemonats gebucht, etwa am 6. Solange ist das normal. Gelb wird der Antrag erst, wenn die Abrechnung vorliegen müsste und keine Buchung enthält."],["Die Provision weicht ab. Was tue ich?",'Zuerst in den Einstellungen prüfen, ob Ihr Faktor stimmt (Startwerte sind Beispiele). Stimmt Ihr Faktor, ist es ein Fall für die Reklamation. Ist die Abweichung in Ordnung, klicken Sie „Akzeptieren".'],['Was mache ich mit „Neu ohne Antrag"?','Das sind Buchungen ohne Ihren Eintrag, etwa Dynamik oder Beitragsanpassung. „Antrag" legt einen Antrag daraus an, „Zuordnen" hängt sie an einen bestehenden, der Haken markiert sie als „kein Antrag nötig".'],["Wie gebe ich Fälle zur Klärung weiter?",'In der Antragsliste die Fälle anhaken und oben „Prioritätenliste exportieren" wählen – als Excel oder als PDF über „Drucken".'],["Ich finde einen Kunden nicht in meinen Anträgen.","F4 (Name) oder F3 (Vertragsnummer) durchsucht auch die gesamte Abrechnung. Die Kundenakte zeigt Buchungen und Tarife, und von dort legen Sie direkt einen Antrag an."],["Wie schütze ich meine Datei mit einem Passwort?","Unter Einstellungen → Passwortschutz. Die Projektdatei und die Sicherung im Browser werden dann verschlüsselt und beim Öffnen wird das Passwort abgefragt. Achtung: Ohne Passwort sind die Daten nicht wiederherstellbar – bitte sicher notieren. Exporte nach Excel oder PDF sind nicht verschlüsselt."],["Darf ich Gesundheitsangaben eintragen?",'Nein. In Bemerkung und Nachbearbeitung gehören keine Diagnosen oder Gesundheitsdetails. Schreiben Sie „Unterlagen nachgefordert", nicht den medizinischen Grund.'],["Kann ich die Projektdatei weitergeben?","Bitte nicht – sie enthält alle Kundendaten. Für die Weitergabe gibt es die Exporte. Bei Fragen zur App helfen die Beispieldaten von der Startseite."],["Ich habe etwas falsch gemacht. Kann ich zurück?","Ja. Unter Einstellungen → Sicherungsstände liegen die letzten zehn Stände; vor jedem Import und vor jedem Löschen wird automatisch einer angelegt."],["Ich habe bisher kein Antragsbuch geführt. Kann ich die App trotzdem nutzen?",'Ja. Lesen Sie nur Ihre Provisionsabrechnung ein und öffnen Sie „Meine Produktion": Dort sehen Sie Monate, Sparten, Kategorien, Neugeschäft, Erhöhungen, Storno und Provision. Über die Kundensuche (F3/F4) finden Sie jeden Vertrag der Abrechnung.'],["Kann ich mein altes Excel-Antragsbuch übernehmen?","Ja. Die Excel-Datei ins Fenster ziehen; die App erkennt das Blatt und übernimmt Monat, Sparte, Tarif, Beitrag, Status und Provision. Danach die Abrechnung desselben Jahres einlesen: Unter Abgleich → Offen schlägt die App die Vertragsnummern über Beitrag und Provision vor – die sicheren mit einem Klick."],["Die Abrechnung ist von einem anderen Jahr als mein Projekt.","Bei einem leeren Projekt stellt die App das Jahr von selbst um. Sind schon Anträge erfasst, fragt sie nach."],["Wie sehe ich, wo ich je Sparte im Team stehe?",'Im Reiter „Team": Sobald die Teamdatei aus der Sammelmappe eingelesen ist, zeigt eine Tabelle je Sparte Ihren Wert, den Median und einen Pfeil in fünf Stufen – von „Spitze" (oberste 20 %) bis „deutlich darunter".'],["Wie halte ich eine Aktion (z. B. ein Anschreiben an 30 Kunden) nach?",'Im Reiter „Aktionen" legen Sie die Aktion an und lesen die Kundenliste als Excel oder CSV ein. Je Kunde tragen Sie bis zu drei Kontakte ein (T Telefon, M E-Mail/Brief, P persönlich, O nicht erreicht, X kein Interesse); das Datum hält die App beim ersten Eintrag fest. Dazu das Ergebnis (Termin, Angebot, Abschluss, Absage) und beim Abschluss den Monatsbeitrag. Quoten und Diagramme entstehen von selbst, die Liste lässt sich als Excel oder PDF ausgeben. Mit „Antrag" erfassen Sie direkt einen Antrag zum Kunden.'],['Warum zeigt „Meine Produktion" zwei verschiedene Beträge?','Der Netto-Beitrag ist die Summe der Beitragsänderungen aller Buchungen. Die Nettoproduktion ist die bewertete Produktion (Spalte „Produktion" der Abrechnung) – diese Größe steht auch in den Monatsscheiben und im Bonus-Reporting. Für Ziele und Bonus zählt die Nettoproduktion.'],["Wo stehe ich im ADP-Wettbewerb?",'Im Reiter „Bonus" tragen Sie die Werte aus Ihrem Bonus-Reporting ein. Die App zeigt Grundbonus, Zusatzboni und was bis zum nächsten Ziel fehlt. Maßgeblich bleibt die Auswertung des Versicherers.'],['Was bedeutet „Lesemodus"?',"Die Lizenz ist abgelaufen oder es fehlt ein Schlüssel. Sie können alles ansehen, suchen und exportieren, aber nichts ändern. Ihre Daten bleiben erhalten. Einen neuen Schlüssel tragen Sie unter Einstellungen → Lizenz ein."],["Was ist der Unterschied zwischen ADP und Management?",'ADP sehen ihr eigenes Antragsbuch und ihren Platz im Team ohne Namen der Kollegen. Führungskräfte schalten auf „Management" und vergleichen ADP aus Abrechnung und Monatsscheiben.']];e.ansichten.hilfe={titel:"Hilfe",icon:"hilfe",unter:"Ablauf, häufige Fragen und Kurzanleitung",zeige:function(u,s,o){s.appendChild(n.btn("Tour starten",e.tour.start,{klasse:"haupt-btn",icon:"funke"}));var h=o.schritt||0,d=!o.schritt,c=null,g=t("div.prozess-reihe"),f=t("div.prozess-detail");function m(r){h=o.schritt=r;var i=a[r],l=g.querySelectorAll(".prozess-schritt"),u=g.querySelectorAll(".prozess-pfeil");l.forEach(function(e,n){e.classList.toggle("aktiv",n===r),e.classList.toggle("fertig",n<r)}),u.forEach(function(e,n){e.classList.toggle("aktiv",n===r-1),e.classList.toggle("fertig",n<r-1)}),n.leere(f),n.anhaengen(f,[t("div",null,t("h3",null,i.nr+" · "+i.titel),t("p",null,i.was)),t("dl",null,t("dt",null,"Wann"),t("dd",null,i.wann),t("dt",null,"Datei"),t("dd",null,i.datei)),n.btn(i.knopf,function(){e.app.zeige(i.ziel)},{klasse:"klein-btn"})]),f.classList.remove("rein"),f.offsetWidth,f.classList.add("rein")}a.forEach(function(e,r){r&&g.appendChild(t("div.prozess-pfeil",{"aria-hidden":"true"},n.s("svg",{viewBox:"0 0 60 16",preserveAspectRatio:"none"},n.s("line",{x1:0,y1:8,x2:50,y2:8}),n.s("path",{d:"M48 2l9 6-9 6",fill:"none"})))),g.appendChild(t("button.prozess-schritt",{type:"button",onclick:function(){d=!1,clearInterval(c),m(r)}},t("span.prozess-nr",null,String(e.nr)),n.icon(e.icon),t("b",null,e.titel),t("small",null,e.kurz)))}),u.appendChild(t("div.karte.prozess.rein",null,t("div.leiste",null,t("h3",null,"So läuft es: vom Antrag bis zur Provision"),t("span.frei"),t("span.mini",null,"Schritt anklicken für Details")),g,f,t("div.mini",{style:{marginTop:"8px"}},"Nach Schritt 5 beginnt der Kreis von vorn: Jeder Monat bringt neue Anträge und eine neue Abrechnung."))),m(h),d&&!window.matchMedia("(prefers-reduced-motion: reduce)").matches&&(c=setInterval(function(){g.isConnecte
